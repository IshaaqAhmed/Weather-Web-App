<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class = "bg-info text-light">
    <div class="text-center">
        <h1 class="mt-3">Weather App</h1>
        <form action = "/" method = "post">
            <div class="container">
                <div class="row">
                    <div class="col-sm">
                        <input type="text" id = "cityName" name="cityName" placeholder="Enter City Name" class="form-control">
                    </div>
                    <div class="col-sm">
                        <input type="text" id="stateName" name="stateName" value="GB" class="form-control">
                    </div>
                    <div class="col-sm">
                        <input type="text" id="countryName" name="countryName" value="England"class="form-control">
                    </div>
                </div>                       
           </div> <br>                 
           
           <button class="submit btn btn-light">Find Weather</button>
                    
                
            
            

        </form> <br>
        {% if final_weather_data %}
        {{final_weather_data.main}}: {{ final_weather_data.description }} <br>
        <img src="https://openweathermap.org/payload/api/media/file/{{final_weather_data.icon}}.png" alt="Icon">
        {{final_weather_data.temperature}} C
        {% endif %}
    </div>  
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> 
</body>
</html>
